<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/bd330374f7.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styel.css">
    <title>Image Gallery</title>
</head>

<body>
    <h1 style="text-align: center; padding: 20px 30px; z-index: 111; color: white;">My Image gallery </h1>
    <div class="gallery">
        <img src="images/n1jpeg.jpeg" data-category="Nature">
        <img src="images/n2.jpeg" data-category="Nature">
        <img src="images/a1.jpeg" data-category="Animal">
        <img src="images/a2.jpg" data-category="Animal">
        <img src="images/c1.jpg" data-category="City">
        <img src="images/c2.jpeg" data-category="City">
    </div>
    <div class="lightbox">

        <span class="close"><i class="fa-solid fa-circle-xmark"></i></span>


        <button id="prev"><i class="fa-solid fa-arrow-left"></i></button>

        <img id="lightbox-image">

        <button id="next"><i class="fa-solid fa-arrow-right"></i></button>



 </div>
    <script src="script.js"></script>
</body>

</html>
